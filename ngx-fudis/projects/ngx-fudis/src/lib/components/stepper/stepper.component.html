<ol
  class="fudis-stepper"
  [class.fudis-stepper--vertical]="orientation === 'vertical'"
  aria-label="{{ _translationService.getTranslations()().STEPPER.ARIA_LABEL }}"
>
  @for (step of stepList; track index; let index = $index) {
    <li
      class="fudis-step"
      [aria-current]="isCurrent(index) ? 'step' : null"
      [aria-label]="getStepAriaLabel(index, step.label)"
    >
      <div
        class="fudis-step__arrow fudis-step__arrow--{{ orientation }}"
        [class.fudis-step__arrow--current]="isCurrent(index)"
        [class.fudis-step__arrow--completed]="isCompleted(index)"
      >
        <div class="fudis-step__arrow__label fudis-step__title">
          <span
            [class.fudis-step__arrow__underline]="isCurrent(index) && orientation === 'vertical'"
          >
            {{ index + 1 + "." }}
          </span>
          @if (orientation === "horizontal") {
            <span [class.fudis-step__arrow__underline]="isCurrent(index)">{{ step.label }}</span>
          }
        </div>
      </div>
      @if (orientation === "vertical") {
        <div
          class="fudis-step__title fudis-step__title--outside"
          [class.fudis-step__title--active]="isCurrent(index)"
        >
          {{ step.label }}
        </div>
      }
    </li>
  }
</ol>
